<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encurtador de Links</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --err:#dc2626; --border:#e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1a1e24; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --err:#f87171; --border:#2b3038; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, Segoe UI, sans-serif; padding:16px; }
    main { width:100%; max-width:520px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; }
    h1 { margin:0 0 4px; font-size:1.4rem; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:.95rem; }
    label { display:block; font-size:.85rem; margin:14px 0 6px; color:var(--muted); }
    input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:transparent;
            color:var(--text); font-size:1rem; }
    input:focus { outline:2px solid var(--accent); outline-offset:1px; }
    button { margin-top:18px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #result { margin-top:20px; display:none; padding:14px; border:1px solid var(--border); border-radius:8px; }
    #result a { color:var(--accent); word-break:break-all; font-weight:600; }
    #result .row { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    #copy { margin:0; width:auto; padding:6px 12px; font-size:.85rem; }
    #stats { margin-top:8px; color:var(--muted); font-size:.85rem; }
    #error { margin-top:14px; color:var(--err); font-size:.9rem; min-height:1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>Encurtador de Links</h1>
    <p class="sub">🤐</p>

    <form id="form">
      <label for="url">URL original</label>
      <input id="url" type="url" placeholder="https://exemplo.com/um/caminho/bem/longo" required>

      <label for="alias">Alias personalizado (opcional)</label>
      <input id="alias" type="text" placeholder="meu-link" pattern="[A-Za-z0-9_\-]{3,32}">

      <button id="submit" type="submit">Encurtar</button>
    </form>

    <div id="error" role="alert"></div>

    <div id="result">
      <div class="row">
        <a id="short" href="#" target="_blank" rel="noopener"></a>
        <button id="copy" type="button">Copiar</button>
      </div>
      <div id="stats"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const result = document.getElementById('result');
    const shortEl = document.getElementById('short');
    const statsEl = document.getElementById('stats');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      result.style.display = 'none';
      submit.disabled = true;
      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: document.getElementById('url').value,
            alias: document.getElementById('alias').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error || 'Erro inesperado'; return; }
        shortEl.textContent = data.short_url;
        shortEl.href = data.short_url;
        statsEl.textContent = 'Estatísticas: /api/stats/' + data.code;
        result.style.display = 'block';
      } catch {
        errorEl.textContent = 'Não foi possível conectar ao servidor.';
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById('copy').addEventListener('click', async (e) => {
      try {
        await navigator.clipboard.writeText(shortEl.textContent);
        e.target.textContent = 'Copiado!';
        setTimeout(() => (e.target.textContent = 'Copiar'), 1500);
      } catch {}
    });
  </script>
</body>
</html>
